<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Resume with Panda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/resume/style.css" />
</head>
<body>
  <div class="bg-gradient">
    <div class="card glass">
      <header class="header">
        <h1>🐼 My Resume with Panda</h1>
        <p class="subtitle">Build a professional resume step‑by‑step.</p>
      </header>
      <section class="welcome">
        <p class="intro">Hi! I’m Panda. I’ll ask you friendly questions and turn your answers into a clean resume.</p>
        <button id="startBtn" class="primary-btn">Start New Resume</button>
      </section>
      <section class="chat hidden" id="chatSection">
        <div id="messages" class="messages"></div>
        <div class="input-group">
          <input type="text" id="userInput" placeholder="Type your answer..." autocomplete="off" />
          <button id="sendBtn" aria-label="Send message">📤</button>
          <button id="voiceBtn" aria-label="Voice input">🎤</button>
        </div>
      </section>
    </div>
  </div>
  <script type="module" src="/resume/script.js"></script>
</body>
</html>
