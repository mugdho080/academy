<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Daily Routine Builder</title>
  <link rel="stylesheet" href="/routine/style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🐼 My Daily Routine</h1>
      <p>Build a healthy routine with Panda</p>
    </header>
    <section id="chat" class="chat"></section>
    <section id="preview" class="preview hidden">
      <h2>Routine Preview</h2>
      <div id="routine-cards" class="cards"></div>
      <button id="save-btn" class="primary-btn">Save Routine</button>
      <button id="edit-btn" class="secondary-btn">Edit</button>
    </section>
  </div>
  <script src="/modules/routine/script.js" type="module"></script>
</body>
</html>
